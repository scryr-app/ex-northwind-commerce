name: northwind-integration

services:
  app:
    build: .
    ports:
      - "127.0.0.1:${INTEGRATION_PORT:-10000}:10000"
    environment:
      APP_ENV: integration
      STRIPE_SECRET_KEY: sk_test_stub
      DATABASE_URL: postgresql://northwind:northwind@postgres:5432/northwind
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: northwind
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind -d northwind"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
