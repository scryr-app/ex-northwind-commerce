# One free service serves both the storefront and API.
# Catalog and stub checkout work without managed databases or credentials.
services:
  - type: web
    name: northwind-commerce
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/live
    envVars:
      - key: VITE_POSTHOG_ENVIRONMENT
        value: production
      - key: APP_ENV
        value: demo
      - key: STRIPE_SECRET_KEY
        value: sk_test_stub
      - key: CORS_ORIGINS
        value: ""
      - key: METRICS_TOKEN
        generateValue: true
      - key: OTEL_TRACE_SAMPLE_RATIO
        value: "0.1"
      - key: REQUEST_LOG_SAMPLE_RATIO
        value: "0.1"
      - key: OTEL_METRIC_EXPORT_INTERVAL
        value: "60"
