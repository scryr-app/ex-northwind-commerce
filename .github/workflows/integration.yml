name: Integration tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Hosted app integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.integration.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: |
          python -m pip install uv==0.12.10
          uv sync --project api --locked --extra dev
      - name: Build and start isolated integration stack
        id: stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Test with healthy Postgres and Redis
        run: >-
          uv run --project api --locked --extra dev pytest tests/integration -v
          --dependency-state healthy
          --junitxml=test-results/integration-healthy.xml
      - name: Stop optional dependencies
        id: disconnect
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: docker compose stop postgres redis
      - name: Test demo behavior during dependency outage
        if: ${{ !cancelled() && steps.disconnect.outcome == 'success' }}
        run: >-
          uv run --project api --locked --extra dev pytest tests/integration -v
          --dependency-state unavailable
          --junitxml=test-results/integration-unavailable.xml
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/containers.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: test-results/
          retention-days: 7
      - name: Clean up isolated containers
        if: always()
        run: docker compose down --volumes --remove-orphans
