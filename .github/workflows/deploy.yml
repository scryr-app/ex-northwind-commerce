name: Verify deployment

# Render deploys main automatically after CI passes (see render.yaml).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Render service URL (https://your-service.onrender.com)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Verify hosted demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the deployment URL
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ['API_URL'])
          if not (url.scheme == 'https' and url.hostname and
                  url.hostname.endswith('.onrender.com') and
                  not url.username and not url.password and
                  not url.port and url.path in ('', '/') and
                  not url.query and not url.fragment):
              raise SystemExit('Enter an HTTPS onrender.com service URL without a path or credentials.')
          PY
      - name: Verify API and storefront
        run: |
          ./scripts/smoke-test.sh
          curl --fail --silent --show-error --max-time 90 "$API_URL/" | grep -q '<div id="root">'
