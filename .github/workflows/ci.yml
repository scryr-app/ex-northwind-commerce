name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: northwind
          POSTGRES_USER: northwind
          POSTGRES_PASSWORD: northwind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://northwind:northwind@localhost:5432/northwind
      REDIS_URL: redis://localhost:6379/0
      STRIPE_SECRET_KEY: sk_test_stub
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  hosting:
    name: Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment image
        run: docker build -t northwind-commerce:ci .
      - name: Verify the hosted storefront and API
        run: |
          docker run -d --name northwind -p 10000:10000 -e STRIPE_SECRET_KEY=sk_test_stub northwind-commerce:ci
          trap 'docker logs northwind; docker rm -f northwind' EXIT
          API_URL=http://localhost:10000 ./scripts/smoke-test.sh
          curl --fail --silent --show-error http://localhost:10000/ | grep -q '<div id="root">'
