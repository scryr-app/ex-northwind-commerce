name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run tests with coverage and JUnit report
        run: |
          mkdir -p test-results
          npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - run: npm run build
      - name: Publish test summary
        if: always()
        run: |
          echo '### Web test reports' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage, LCOV, HTML, and JUnit reports are available in the web-test-results artifact.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: web/test-results/
          if-no-files-found: warn
          retention-days: 14

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://northwind:northwind@localhost:5432/northwind
      REDIS_URL: redis://localhost:6379/0
      STRIPE_SECRET_KEY: sk_test_stub
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage and reports
        run: |
          mkdir -p test-results
          pytest -ra --durations=20 \
            --junitxml=test-results/junit.xml \
            --html=test-results/report.html --self-contained-html \
            --json-report --json-report-file=test-results/report.json \
            --cov=northwind_api --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=html:test-results/coverage-html
      - name: Publish coverage summary
        if: always()
        run: |
          echo '### API test reports' >> "$GITHUB_STEP_SUMMARY"
          echo 'Coverage XML/HTML, pytest HTML/JSON, and JUnit reports are available in the api-test-results artifact.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: api/test-results/
          if-no-files-found: warn
          retention-days: 14
