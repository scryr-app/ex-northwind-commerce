# Optional Prometheus/Mimir ruler rules. Upload only after metrics arrive.
# No absent-metrics alert: the Render Free instance intentionally sleeps.
groups:
  - name: northwind
    interval: 1m
    rules:
      - alert: NorthwindHighErrorRate
        expr: >-
          (sum(rate(northwind_http_requests_total{job="northwind-api",status_code=~"5.."}[10m]))
          / sum(rate(northwind_http_requests_total{job="northwind-api"}[10m])) > 0.05)
          and (sum(increase(northwind_http_requests_total{job="northwind-api"}[10m])) >= 20)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Northwind server errors exceed 5 percent
          description: Inspect the request logs and the Render deployment events.
          runbook_url: https://github.com/scryr-app/ex-northwind-commerce/blob/main/docs/observability.md
      - alert: NorthwindSlowRequests
        expr: >-
          (histogram_quantile(0.95, sum by (le) (rate(northwind_http_request_duration_seconds_bucket{job="northwind-api"}[10m]))) > 1)
          and (sum(increase(northwind_http_requests_total{job="northwind-api"}[10m])) >= 20)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Northwind p95 request duration exceeds one second
          description: Inspect API traces and Render CPU/memory metrics.
          runbook_url: https://github.com/scryr-app/ex-northwind-commerce/blob/main/docs/observability.md
